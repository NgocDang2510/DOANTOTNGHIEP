server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Internal health check (used by docker-compose)
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
