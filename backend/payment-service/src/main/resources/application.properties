spring.application.name=saf-payment-service
server.port=8084

# MariaDB — payment_db
spring.datasource.url=jdbc:mariadb://localhost:3306/payment_db?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# JWT (validation only — same secret as auth-service)
app.jwt.secret-key=${JWT_SECRET:saf-secret-key-very-long-string-for-jwt-signing-operations-please-change-in-production}

# VNPay
vnpay.tmn-code=${VNPAY_TMN_CODE:MN4OM22F}
vnpay.hash-secret=${VNPAY_HASH_SECRET:SESMP4R01MMR2JXHL39706NU6D8MU81P}
vnpay.payment-url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost/api/payments/vnpay-return}

# Inter-service URLs
services.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.booking-service.url=${BOOKING_SERVICE_URL:http://localhost:8083}
services.room-service.url=${ROOM_SERVICE_URL:http://localhost:8082}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
