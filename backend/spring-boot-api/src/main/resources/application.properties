spring.application.name=saf-core-api
server.port=8082

# Ket noi MariaDB Local
spring.datasource.url=jdbc:mariadb://localhost:3306/accommodation_db?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Cau hinh Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# JWT Configuration
app.jwt.secret-key=${JWT_SECRET:saf-secret-key-very-long-string-for-jwt-signing-operations-please-change-in-production}
app.jwt.access-token-expiration=3600000
app.jwt.refresh-token-expiration=604800000

# AWS S3 Configuration
aws.access-key=${AWS_ACCESS_KEY:your-access-key}
aws.secret-key=${AWS_SECRET_KEY:your-secret-key}
aws.s3.region=ap-southeast-1
aws.s3.bucket=s3-dynamodb-cloudfront-ngocdang

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Local file upload (fallback khi không có S3)
app.upload.dir=uploads
app.upload.base-url=http://localhost:8082

# VNPay Sandbox — đăng ký tại https://sandbox.vnpayment.vn/devreg/
vnpay.tmn-code=MN4OM22F
vnpay.hash-secret=SESMP4R01MMR2JXHL39706NU6D8MU81P
vnpay.payment-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8082/api/payments/vnpay-return
vnpay.frontend-url=https://localhost:5173

# ── Microservices: RabbitMQ (Message Queue) ────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:saf}
spring.rabbitmq.password=${RABBITMQ_PASS:saf123}

# ── Microservices: Distributed Tracing (Zipkin) ────────────────────────────
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411}/api/v2/spans

# ── Microservices: Circuit Breaker (Resilience4j) ──────────────────────────
# notification — bảo vệ RabbitMQ publish
resilience4j.circuitbreaker.instances.notification.register-health-indicator=true
resilience4j.circuitbreaker.instances.notification.sliding-window-size=10
resilience4j.circuitbreaker.instances.notification.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.notification.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notification.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.notification.permitted-number-of-calls-in-half-open-state=3
# vnpay — bảo vệ thanh toán với cổng VNPay
resilience4j.circuitbreaker.instances.vnpay.register-health-indicator=true
resilience4j.circuitbreaker.instances.vnpay.sliding-window-size=5
resilience4j.circuitbreaker.instances.vnpay.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.vnpay.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.vnpay.wait-duration-in-open-state=60s

# ── Actuator: expose circuit breaker + tracing endpoints ───────────────────
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always

