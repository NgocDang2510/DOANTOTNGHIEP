spring.application.name=saf-room-service
server.port=8082

# MariaDB — room_db
spring.datasource.url=jdbc:mariadb://localhost:3306/room_db?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# JWT (validation only — same secret as auth-service)
app.jwt.secret-key=${JWT_SECRET:saf-secret-key-very-long-string-for-jwt-signing-operations-please-change-in-production}

# AWS S3
aws.access-key=${AWS_ACCESS_KEY:}
aws.secret-key=${AWS_SECRET_KEY:}
aws.s3.region=${AWS_REGION:ap-southeast-1}
aws.s3.bucket=${AWS_S3_BUCKET:saf-uploads}
app.upload.dir=uploads
app.upload.base-url=http://localhost:8082

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Inter-service URLs
services.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.booking-service.url=${BOOKING_SERVICE_URL:http://localhost:8083}
services.payment-service.url=${PAYMENT_SERVICE_URL:http://localhost:8084}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
