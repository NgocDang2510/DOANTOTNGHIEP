spring.application.name=saf-booking-service
server.port=8083

# MariaDB — booking_db
spring.datasource.url=jdbc:mariadb://localhost:3306/booking_db?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# JWT (validation only — same secret as auth-service)
app.jwt.secret-key=${JWT_SECRET:saf-secret-key-very-long-string-for-jwt-signing-operations-please-change-in-production}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:saf}
spring.rabbitmq.password=${RABBITMQ_PASS:saf123}

# Resilience4j
resilience4j.circuitbreaker.instances.notification.sliding-window-size=10
resilience4j.circuitbreaker.instances.notification.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.notification.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notification.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.notification.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.vnpay.sliding-window-size=5
resilience4j.circuitbreaker.instances.vnpay.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.vnpay.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.vnpay.wait-duration-in-open-state=60s

# Inter-service URLs
services.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.room-service.url=${ROOM_SERVICE_URL:http://localhost:8082}
services.payment-service.url=${PAYMENT_SERVICE_URL:http://localhost:8084}

# Actuator
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.endpoint.health.show-details=always
