spring.application.name=saf-auth-service
server.port=8081

# MariaDB — auth_db
spring.datasource.url=jdbc:mariadb://localhost:3306/auth_db?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# JWT
app.jwt.secret-key=${JWT_SECRET:saf-secret-key-very-long-string-for-jwt-signing-operations-please-change-in-production}
app.jwt.access-token-expiration=3600000
app.jwt.refresh-token-expiration=604800000

# AWS S3
aws.access-key=${AWS_ACCESS_KEY:}
aws.secret-key=${AWS_SECRET_KEY:}
aws.s3.region=${AWS_REGION:ap-southeast-1}
aws.s3.bucket=${AWS_S3_BUCKET:saf-uploads}
app.upload.dir=uploads
app.upload.base-url=http://localhost:8081

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=dangpham1010da@gmail.com
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:saf}
spring.rabbitmq.password=${RABBITMQ_PASS:saf123}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
