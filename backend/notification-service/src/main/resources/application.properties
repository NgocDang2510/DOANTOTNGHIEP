spring.application.name=saf-notification-service
server.port=8085

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3310/notification_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false

# JWT
app.jwt.secret-key=${JWT_SECRET:saf-secret-key-very-long-string-for-jwt-signing-operations-please-change-in-production}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:saf}
spring.rabbitmq.password=${RABBITMQ_PASS:saf123}

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=dangpham1010da@gmail.com
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Inter-service URLs
services.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
