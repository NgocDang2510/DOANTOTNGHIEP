spring.application.name=saf-notification-service
server.port=8085

# No database — stateless email sender

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:saf}
spring.rabbitmq.password=${RABBITMQ_PASS:saf123}

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=dangpham1010da@gmail.com
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Inter-service URLs
services.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
